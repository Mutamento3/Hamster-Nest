name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'tests/edge-auth.test.mjs'
      - 'scripts/edge-import-smoke.mjs'
      - 'scripts/deploy-edge-functions.sh'
      - 'tests/edge-deploy.test.mjs'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Run Edge auth regression tests
        run: npm test

      - name: Smoke-test Edge entrypoints without network access
        run: >-
          npx --yes deno@2.5.6 run --no-check --no-lock --node-modules-dir=none
          --config supabase/functions/conversation-dispatch/deno.json
          --allow-env --allow-read=supabase/functions scripts/edge-import-smoke.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy all Edge Functions
        # Server-side bundling avoids public ECR image-download rate limits on runners.
        run: bash scripts/deploy-edge-functions.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
